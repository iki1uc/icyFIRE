<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NEUTRON · 0000 ENERGIE</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas;
    padding:40px;
    text-align:center;
}

/* Szene */
#scene {
    width:340px;
    height:340px;
    margin:auto;
    position:relative;
    border:3px solid #777;
    border-radius:50%;
    box-shadow:0 0 25px #333 inset;
}

/* Achsenlinien */
.axis {
    position:absolute;
    background:#777;
    opacity:0.25;
    transition:opacity 0.4s;
}

/* Vertikal */
#v {
    width:3px;
    height:340px;
    left:50%;
    top:0;
    transform:translateX(-50%);
}

/* Horizontal */
#h {
    width:340px;
    height:3px;
    top:50%;
    left:0;
    transform:translateY(-50%);
}

/* Diagonal */
#d1 {
    width:3px;
    height:340px;
    left:50%;
    top:0;
    transform:translateX(-50%) rotate(45deg);
}

#d2 {
    width:3px;
    height:340px;
    left:50%;
    top:0;
    transform:translateX(-50%) rotate(-45deg);
}

/* NEUTRON-Kern (0000) */
#core {
    position:absolute;
    width:70px;
    height:70px;
    background:#111;
    border:3px solid #999;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ccc;
    font-size:18px;
    animation:pulse 4s infinite;
}

/* Pulsation – ultra neutral */
@keyframes pulse {
    0%   { transform:translate(-50%, -50%) scale(1);   border-color:#777; color:#aaa; }
    50%  { transform:translate(-50%, -50%) scale(1.25); border-color:#fff; color:#fff; }
    100% { transform:translate(-50%, -50%) scale(1);   border-color:#777; color:#aaa; }
}

/* Energie-Rotation – sehr ruhig */
#energy {
    position:absolute;
    width:300px;
    height:300px;
    border:2px dashed #777;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    animation:rotate540 12s linear infinite;
}

@keyframes rotate540 {
    from { transform:translate(-50%, -50%) rotate(0deg); }
    to   { transform:translate(-50%, -50%) rotate(540deg); }
}

/* Nebel-Schicht – FIXED */
#fog {
    position:absolute;
    width:340px;
    height:340px;
    border-radius:50%;
    top:0;
    left:0;
    background:radial-gradient(circle,
        rgba(255,255,255,0.05) 0%,
        rgba(0,0,0,0.8) 70%);
    animation:fogPulse 6s infinite;
}

@keyframes fogPulse {
    0%   { opacity:0.10; }
    50%  { opacity:0.22; }
    100% { opacity:0.10; }
}
</style>
</head>

<body>

<h1>NEUTRON · 0000 ENERGIE</h1>

<div id="scene">
    <div id="fog"></div>
    <div id="energy"></div>
    <div id="v" class="axis"></div>
    <div id="h" class="axis"></div>
    <div id="d1" class="axis"></div>
    <div id="d2" class="axis"></div>
    <div id="core">0000</div>
</div>

<pre>
NEUTRON = 0000 Energie
RUN8 = N S E W UP DOWN IN OUT
UFO = 9^9
NEU = 81 ÷ 9
Ultra‑Neutralität · Energie‑Ruhe
</pre>

<script>
// Achsen-Flimmern – neutral
setInterval(() => {
    const axes = document.querySelectorAll('.axis');
    axes.forEach(a => a.style.opacity = Math.random() * 0.25 + 0.10);
}, 500);

// NEUTRON‑Cycle
let pulse = 0;
setInterval(() => {
    pulse = (pulse + 1) % 81;
    document.getElementById("core").style.color =
        pulse % 3 === 0 ? "#ccc" :
        pulse % 3 === 1 ? "#fff" :
                          "#aaa";
}, 260);
</script>

</body>
</html>
